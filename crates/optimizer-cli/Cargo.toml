[package]
name = "optimizer-cli"
version = "0.1.0"
edition = "2021"
authors = ["Telegram Video Stream Optimizer"]
description = "Command-line interface for Telegram Video Stream Optimizer"

[dependencies]
optimizer-core = { path = "../optimizer-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
