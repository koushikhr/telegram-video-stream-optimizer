[package]
name = "telegram-video-stream-optimizer"
version = "0.1.0"
description = "Universal Telegram Video Stream Optimizer"
authors = ["Telegram Video Stream Optimizer"]
edition = "2021"

[lib]
name = "telegram_video_stream_optimizer_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
optimizer-core = { path = "../crates/optimizer-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
